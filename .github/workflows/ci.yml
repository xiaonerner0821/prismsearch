# PrismSearch 持续集成流水线
#
# 注意：下面各 job 的 name 会作为 main 分支保护的必需检查名
# （scripts/dev/setup-github.* 里写死了这些名字），改名时两边要同步。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的旧运行自动取消，省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 主项目的 lint / 类型 / 构建 / 测试，跨三个平台验证
  test:
    name: 测试 (${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # package.json 的 engines 要求 >=22.19.0，这里是它的事实基线
        node: [22, 24]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 配置 Node.js ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 校验 Node 版本满足 engines 要求
        shell: bash
        run: |
          node -e '
            const required = require("./package.json").engines.node.replace(/[^0-9.]/g, "");
            const [wantMajor, wantMinor] = required.split(".").map(Number);
            const [gotMajor, gotMinor] = process.versions.node.split(".").map(Number);
            const ok = gotMajor > wantMajor || (gotMajor === wantMajor && gotMinor >= wantMinor);
            if (!ok) {
              console.error(`Node ${process.versions.node} 不满足 engines 要求 ${required}`);
              process.exit(1);
            }
            console.log(`Node ${process.versions.node} 满足 engines 要求 >=${required}`);
          '

      - name: ESLint 代码检查
        run: npm run lint

      - name: DeepSeek Harness 插件包与主包同步
        run: node scripts/sync-dsh-plugin.mjs --check

      - name: TypeScript 类型检查
        run: npm run typecheck

      - name: 编译构建
        run: npm run build

      - name: 单元测试
        run: npm run test

      # 覆盖率只在一个组合上采集，避免重复上传
      - name: 覆盖率
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run test:coverage

      - name: 上传覆盖率
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/lcov.info
          # 未配置时为空，公开仓库可走 tokenless 上传（取决于 Codecov 侧设置），见 docs/RELEASING.md
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # TS Worker（浏览器渲染）的测试与构建
  worker-ts:
    name: TS Worker (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: workers/ts-worker/package-lock.json

      - name: 安装依赖
        working-directory: workers/ts-worker
        run: npm ci

      - name: 类型检查
        working-directory: workers/ts-worker
        run: npm run typecheck

      - name: 测试
        working-directory: workers/ts-worker
        run: npm test

      - name: 构建
        working-directory: workers/ts-worker
        run: npm run build

  # Python Worker（curl_cffi + trafilatura）
  worker-py:
    name: Python Worker (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: workers/py-worker/requirements.lock

      - name: 安装依赖
        working-directory: workers/py-worker
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install ruff pytest pytest-asyncio

      - name: Ruff 检查
        working-directory: workers/py-worker
        run: ruff check .

      - name: 测试
        working-directory: workers/py-worker
        run: pytest -q

  # 密钥泄漏扫描（防止 API Key 等凭据被提交）
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # gitleaks-action 在 PR 上需要列出 PR 的提交
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks 扫描
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 验证镜像可构建（主服务与两个 Worker）
  docker-build:
    name: 镜像构建 (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 主服务
            file: docker/Dockerfile
            context: .
          - name: TS Worker
            file: workers/ts-worker/Dockerfile
            context: workers/ts-worker
          - name: Python Worker
            file: workers/py-worker/Dockerfile
            context: workers/py-worker

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: 构建 ${{ matrix.name }} 镜像
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
