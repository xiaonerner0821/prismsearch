[project]
name = "prismsearch-py-worker"
version = "0.3.3"
description = "PrismSearch 抓取 Worker（Python：curl_cffi + trafilatura），实现 docs/worker-protocol.md 定义的 HTTP+JSON 协议"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    # 下限对齐当前测试通过的版本（curl_cffi 0.17 / trafilatura 2.3 / bs4 4.15）
    "curl_cffi>=0.17",
    "trafilatura>=2.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
prismsearch-py-worker = "py_worker.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["py_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
