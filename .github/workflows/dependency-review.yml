# 依赖审查：在 PR 上拦截引入已知漏洞或不合规许可证的依赖
name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: 审查依赖变更
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          # 高危及以上直接阻断
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # 许可证用白名单（deny-licenses 已弃用）。本项目为 Apache-2.0，只接受宽松许可证与弱 copyleft：
          #   LGPL-*-or-later：sharp 依赖的 libvips 预编译包为 LGPL-3.0-or-later，动态链接使用不传染；
          #   MPL-2.0：文件级 copyleft，未修改其源码时不影响本项目许可。
          # 依赖的许可证无法识别（unknown / 非 SPDX）时也会被拦下，需人工确认后在
          # allow-dependencies-licenses 中按 purl 单独放行。
          allow-licenses: >-
            MIT, MIT-0, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD,
            BlueOak-1.0.0, CC0-1.0, CC-BY-3.0, CC-BY-4.0, Python-2.0, PSF-2.0,
            Unlicense, MPL-2.0, Zlib, BSL-1.0, WTFPL,
            LGPL-2.1-only, LGPL-2.1-or-later, LGPL-3.0-only, LGPL-3.0-or-later
