name: 功能请求 / Feature Request
description: 建议一个新功能 / Suggest a new feature
labels: ['enhancement']
body:
  - type: textarea
    id: description
    attributes:
      label: 功能描述 / Feature Description
      description: 描述你想要的功能
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: 使用场景 / Use Case
      description: 这个功能能解决什么问题？目前是怎么绕过的？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议实现方案 / Proposed Solution
      description: 可选：你建议的实现方式

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案 / Alternatives Considered

  - type: checkboxes
    id: contribute
    attributes:
      label: 是否愿意贡献 PR / Willing to Contribute
      options:
        - label: 是，我愿意提交 PR / Yes, I'd like to open a PR
